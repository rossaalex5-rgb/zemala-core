<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZEMALA Core - Local Interface [Stufe 100]</title>
    <style>
        body { background-color: #0b0b0b; color: #00ff66; font-family: monospace; padding: 20px; }
        header { border-bottom: 1px solid #00ff66; padding-bottom: 10px; margin-bottom: 20px; }
        .card { border: 1px solid #333; padding: 15px; margin-bottom: 15px; background: #121212; }
        .status { color: #ffff00; }
    </style>
</head>
<body>
    <header>
        <h1>ZEMALA CORE // LOCAL INTERFACE</h1>
        <p>Operational Frequency: <span id="sys-freq">Loading...</span> | Compliance: <span id="sys-compliance">Loading...</span></p>
    </header>
    
    <div class="card">
        <h3>System Telemetry</h3>
        <p>State: <span id="sys-state" class="status">SYNCING...</span></p>
        <p>Ledger Integrity: <span class="status">CRYPTOGRAPHICALLY SEALED</span></p>
    </div>

    <div class="card">
        <h3>Active Modules</h3>
        <ul id="repo-list">
            <li>Loading Repositories...</li>
        </ul>
    </div>

    <script>
        fetch('telemetry.json')
            .then(response => response.json())
            .then(data => {
                document.getElementById('sys-freq').innerText = data.frequency;
                document.getElementById('sys-compliance').innerText = data.compliance;
                document.getElementById('sys-state').innerText = data.state;
                
                const repoList = document.getElementById('repo-list');
                repoList.innerHTML = '';
                data.repositories.forEach(repo => {
                    const li = document.createElement('li');
                    li.innerText = repo;
                    repoList.appendChild(li);
                });
            })
            .catch(err => {
                document.getElementById('sys-state').innerText = "OFFLINE / LOCAL FALLBACK";
            });
    </script>
</body>
</html>
